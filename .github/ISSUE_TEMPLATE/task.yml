name: Task
description: 기능, 문서, 인프라 등 단일 작업 단위
title: "[Task] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        작업 전 [docs/WORKFLOW.md](../blob/main/docs/WORKFLOW.md) 프로세스를 확인하세요.
  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 왜 이 작업이 필요한가?
      placeholder: Duolingo로는 알 수 없는 '이해가 끊기는 지점'을 기록하기 위해...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: PR merge 시 충족해야 할 체크리스트
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: 범위 밖
      description: 이번 이슈에서 하지 않을 것
    validations:
      required: false
